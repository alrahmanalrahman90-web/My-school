const ic=(n,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;
const $=s=>document.querySelector(s);
const DAYS=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'],MON=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>{d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const loc=d=>ymd(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fd=s=>{const d=new Date(s.slice(0,10)+'T00:00');return DAYS[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()};
const ft=s=>new Date(s).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
let db={name:'',sound:true,schedule:[],tasks:[],notes:[],events:[],reminders:[],notifs:[],fired:{}};
try{Object.assign(db,JSON.parse(localStorage.getItem('myschool')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('myschool',JSON.stringify(db))}catch(e){toast('Penyimpanan penuh','Hapus beberapa gambar lalu coba lagi.')}};
let tab='home',cm=new Date(),all=false,q='';
const A={};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t.dataset.id,t)});
const dA=(a,id)=>`data-a="${a}"${id?` data-id="${id}"`:''}`;
const by=k=>(a,b)=>a[k]<b[k]?-1:a[k]>b[k]?1:0;
const sched=d=>db.schedule.filter(s=>s.day==d);
const unread=()=>db.notifs.filter(n=>!n.read).length;

/* ---------- Form & dialog ---------- */
function sheet(inner){const m=document.createElement('div');m.className='sheet';m.innerHTML=`<div class="box" role="dialog">${inner}</div>`;m.addEventListener('click',e=>{if(e.target===m||e.target.closest('[data-x]'))m.remove()});document.body.appendChild(m);return m}
function form(title,fields,v,onSave,onDel){
  v=v||{};
  const h=fields.map(f=>{const[k,l,t,o]=f,val=v[k];
    return `<label>${l}${t=='img'?`<input type="hidden" name="${k}" value="${esc(val)}"><input type="file" accept="image/*" data-im><img class="th" alt="Pratinjau" ${val?`src="${esc(val)}"`:'hidden'}><button type="button" class="chip red" data-clr style="margin-top:8px" ${val?'':'hidden'}>Hapus gambar</button>`:t=='area'?`<textarea name="${k}">${esc(val)}</textarea>`:t=='sel'?`<select name="${k}">${o.map(x=>`<option value="${esc(x[0])}" ${String(val??'')===String(x[0])?'selected':''}>${esc(x[1])}</option>`).join('')}</select>`:`<input name="${k}" type="${t}" value="${esc(val)}">`}</label>`}).join('');
  const m=sheet(`<div class="hd"><b>${title}</b><button class="ib" data-x aria-label="Tutup">${ic('x')}</button></div>${h}<p class="err"></p><button class="btn" data-ok>Simpan</button>${onDel?'<button class="btn red" data-del>Hapus</button>':''}`);
  m.querySelector('[data-ok]').onclick=()=>{
    const o={};for(const f of fields){const el=m.querySelector(`[name="${f[0]}"]`);o[f[0]]=el.value.trim();if(!o[f[0]]&&f[4]!==0){m.querySelector('.err').textContent=`${f[1]} wajib diisi.`;return}}
    const er=onSave(o);if(er){m.querySelector('.err').textContent=er;return}
    save();m.remove();render()};
  if(onDel)m.querySelector('[data-del]').onclick=()=>ask('Hapus data ini?',()=>{onDel();save();m.remove();render()});
}
function ask(msg,ok){const m=sheet(`<p style="margin:8px 0 4px"><b>${esc(msg)}</b></p><button class="btn red" data-y>Ya, lanjutkan</button><button class="btn lt" data-x>Batal</button>`);m.querySelector('[data-y]').onclick=()=>{m.remove();ok()}}
function toast(t,b){const e=document.createElement('div');e.className='toast';e.innerHTML=`<span style="color:var(--b)">${ic('bell')}</span><div><b>${esc(t)}</b><small>${esc(b||'')}</small></div>`;document.body.appendChild(e);setTimeout(()=>e.remove(),6000)}

/* ---------- Pengingat ---------- */
const OFF=[['','Tanpa pengingat'],['1440','1 hari sebelumnya'],['60','1 jam sebelumnya'],['0','Tepat waktu']];
function link(ref,title,body,type,date,time,off){
  db.reminders=db.reminders.filter(r=>r.ref!==ref);
  if(off===''||off==null)return;
  const at=new Date(new Date(date+'T'+time)-off*60000);
  db.reminders.push({id:uid(),ref,title,body,type,at:loc(at),repeat:'',done:false});
}
const remOf=ref=>{const r=db.reminders.find(r=>r.ref===ref);return r?String(Math.round((new Date(r.srcAt)-new Date(r.at))/60000)):''};
function push(title,body){
  db.notifs.unshift({id:uid(),title,body,time:new Date().toISOString(),read:false});db.notifs=db.notifs.slice(0,100);
  toast(title,body);
  try{if(db.sound){const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(c.currentTime+.25)}}catch(e){}
  try{if('Notification' in window&&Notification.permission==='granted')new Notification(title,{body})}catch(e){}
}
function tick(){
  const now=new Date();let ch=false;
  db.reminders.forEach(r=>{if(!r.done&&new Date(r.at)<=now){push(r.title,r.body||'Waktunya pengingat');ch=true;
    if(r.repeat){let d=new Date(r.at);const st=r.repeat=='daily'?1:7;while(d<=now)d.setDate(d.getDate()+st);r.at=loc(d)}else r.done=true}});
  if(ch){save();if(tab=='home'||tab=='notif')render()}
}
A.perm=()=>{if(!('Notification' in window))return toast('Tidak didukung','Browser ini belum mendukung notifikasi perangkat. Pengingat tetap muncul di dalam aplikasi.');
  Notification.requestPermission().then(()=>render())};
const permInfo=()=>!('Notification' in window)?'Notifikasi perangkat tidak didukung. Pengingat muncul di dalam aplikasi.':Notification.permission=='granted'?'Notifikasi perangkat aktif.':Notification.permission=='denied'?'Izin ditolak di browser. Pengingat tetap muncul di dalam aplikasi.':'Izinkan notifikasi agar pengingat tampil di layar perangkat saat aplikasi terbuka.';

/* ---------- Tampilan ---------- */
const hd=(t,act)=>`<div class="top"><h1>${t}</h1>${act||''}</div>`;
const addBtn=a=>`<button class="ib" ${dA(a)} aria-label="Tambah">${ic('plus')}</button>`;
const empty=t=>`<p class="empty">${t}</p>`;
const V={};
V.home=()=>{
  const n=new Date(),h=n.getHours(),g=h<11?'Selamat pagi':h<15?'Selamat siang':h<18?'Selamat sore':'Selamat malam';
  const ts=sched(n.getDay()),pend=db.tasks.filter(t=>!t.done).length;
  const nr=db.reminders.filter(r=>!r.done).sort(by('at'))[0];
  const ev=db.events.filter(e=>e.date>=ymd()).sort(by('date')).slice(0,3);
  const nt=[...db.notes].sort((a,b)=>b.ts-a.ts)[0];
  return `<div class="top"><div class="logo">${ic('cap',26)}<span style="font-size:20px">MySchool</span></div><button class="ib" ${dA('tab','notif')} aria-label="Notifikasi">${ic('bell')}${unread()?`<span class="badge">${unread()}</span>`:''}</button></div>
  <h1>${g}${db.name?', '+esc(db.name):''}</h1><small>${fd(ymd())}</small>
  <h2>Jadwal hari ini</h2><div class="card">${ts.length?ts.map((s,i)=>`<div class="row"><b style="color:var(--b);min-width:24px">${i+1}</b><div class="g">${esc(s.subject)}</div></div>`).join(''):empty(n.getDay()==0?'Hari Minggu, tidak ada jadwal.':'Belum ada jadwal hari ini.')}</div>
  <div class="grid2" style="margin-top:12px"><div class="card"><small>Tugas belum selesai</small><b style="font-size:30px;color:var(--b)">${pend}</b></div>
  <div class="card"><small>Pengingat terdekat</small>${nr?`<b>${esc(nr.title)}</b><small>${ft(nr.at)}</small>`:'<small>Belum ada</small>'}</div></div>
  <h2>Ujian dan kegiatan</h2><div class="card">${ev.length?ev.map(e=>`<div class="row"><div class="g" ${dA('edE',e.id)}><b>${esc(e.title)}</b><small>${esc(e.type)} · ${fd(e.date)}</small></div></div>`).join(''):empty('Belum ada kegiatan mendatang.')}</div>
  <h2>Catatan</h2><div class="card">${nt?`<div class="g" ${dA('tab','notes')}><b>${esc(nt.title)}</b><small>${db.notes.length} catatan tersimpan</small></div>`:empty('Belum ada catatan.')}</div>
  <h2>Akses cepat</h2><div class="grid2"><button class="q" ${dA('addT')}>${ic('task')}Tambah tugas</button><button class="q" ${dA('addN')}>${ic('note')}Tambah catatan</button><button class="q" ${dA('addR')}>${ic('bell')}Buat pengingat</button><button class="q" ${dA('tab','cal')}>${ic('cal')}Kalender</button></div>`};

V.sched=()=>hd('Jadwal')+[1,2,3,4,5,6].map(d=>{const l=sched(d);return `<h2>${DAYS[d]}${d==new Date().getDay()?' (hari ini)':''}</h2><div class="card">${l.map(s=>`<div class="row"><div class="g">${esc(s.subject)}</div><button class="chip" ${dA('edS',s.id)}>Edit</button><button class="chip red" ${dA('delS',s.id)}>Hapus</button></div>`).join('')||empty('Belum ada mata pelajaran.')}${l.length>=4?'<small>Maksimal 4 mata pelajaran per hari.</small>':`<form class="af" data-d="${d}"><input maxlength="80" placeholder="Mata pelajaran" aria-label="Mata pelajaran ${DAYS[d]}" required><button class="btn" style="margin:0;width:auto;padding:0 18px">Tambah</button></form>`}</div>`}).join('');
const sOK=(v,d,id)=>{if(!v)return 'Nama tidak boleh kosong.';if(db.schedule.some(s=>s.id!==id&&s.day==d&&s.subject.toLowerCase()==v.toLowerCase()))return 'Mata pelajaran sudah ada.'};
document.addEventListener('submit',e=>{if(!e.target.matches('.af'))return;e.preventDefault();const d=+e.target.dataset.d,v=e.target.querySelector('input').value.trim(),er=sOK(v,d);
  if(er)return toast('Tidak bisa menambah',er);if(sched(d).length>=4)return toast('Tidak bisa menambah','Maksimal 4 mata pelajaran per hari.');
  db.schedule.push({id:uid(),day:d,subject:v});save();render()});
A.edS=id=>{const s=db.schedule.find(x=>x.id==id);form('Edit mata pelajaran',[['subject','Nama mata pelajaran','text']],s,o=>sOK(o.subject,s.day,id)||void(s.subject=o.subject))};
A.delS=id=>{const s=db.schedule.find(x=>x.id==id);ask(`Hapus ${s.subject} dari jadwal ${DAYS[s.day]}?`,()=>{db.schedule=db.schedule.filter(x=>x.id!=id);save();render()})};

V.tasks=()=>{
  const l=db.tasks.filter(t=>all||!t.done),gr={};l.forEach(t=>(gr[t.subject]=gr[t.subject]||[]).push(t));
  return `<div class="top"><button class="ib" ${dA('tab','set')} aria-label="Kembali">${ic('l')}</button><h1 style="flex:1">Tugas</h1>${addBtn('addT')}</div>`+`<div class="bar"><button class="btn ${all?'lt':''}" ${dA('flt','0')}>Belum selesai</button><button class="btn ${all?'':'lt'}" ${dA('flt','1')}>Semua</button></div>`+
  (Object.keys(gr).sort().map(s=>`<h2>${esc(s)}</h2><div class="card">${gr[s].sort(by('due')).map(t=>`<div class="row ${t.done?'done':''}"><button class="chk ${t.done?'on':''}" ${dA('tog',t.id)} aria-label="Tandai selesai">${t.done?ic('check',16):''}</button><div class="g" ${dA('edT',t.id)}><b>${esc(t.title)}</b><small class="${!t.done&&t.due<ymd()?'late':''}">Batas: ${fd(t.due)}</small>${t.desc?`<small>${esc(t.desc)}</small>`:''}${t.img?`<img class="th" src="${esc(t.img)}" alt="Lampiran tugas">`:''}</div></div>`).join('')}</div>`).join('')||empty('Tidak ada tugas. Ketuk + untuk menambah.'));
};
const fT=[['subject','Mata pelajaran','text'],['title','Judul tugas','text'],['desc','Deskripsi','area',0,0],['due','Batas pengumpulan','date'],['img','Gambar (opsional)','img',0,0],['rem','Pengingat','sel',OFF]];
const tSave=(t,o)=>{const{rem,...r}=o;Object.assign(t,r);t.srcAt=r.due;link('t'+t.id,'Tugas: '+t.title,t.subject,'Tugas',r.due,'23:59',rem)};
A.addT=()=>form('Tambah tugas',fT,{due:ymd(),rem:'1440'},o=>{const t={id:uid(),done:false};tSave(t,o);db.tasks.push(t)});
A.edT=id=>{const t=db.tasks.find(x=>x.id==id),r=db.reminders.find(x=>x.ref=='t'+id);
  const rm=r?String(Math.round((new Date(t.due+'T23:59')-new Date(r.at))/60000)):'';
  form('Edit tugas',fT,{...t,rem:rm},o=>tSave(t,o),()=>{db.tasks=db.tasks.filter(x=>x.id!=id);link('t'+id)})};
A.tog=id=>{const t=db.tasks.find(x=>x.id==id);t.done=!t.done;if(t.done)db.reminders=db.reminders.filter(r=>r.ref!=='t'+id);save();render()};
A.flt=v=>{all=v=='1';render()};

V.notes=()=>hd('Catatan',addBtn('addN'))+`<input id="q" placeholder="Cari catatan" value="${esc(q)}" aria-label="Cari catatan" style="background:#fff"><div id="nl">${noteList()}</div>`;
function noteList(){
  const l=db.notes.filter(n=>(n.title+n.body+n.subject).toLowerCase().includes(q.toLowerCase())),gr={};l.forEach(n=>(gr[n.subject||'Umum']=gr[n.subject||'Umum']||[]).push(n));
  return Object.keys(gr).sort().map(s=>`<h2>${esc(s)}</h2><div class="card">${gr[s].map(n=>`<div class="row"><div class="g" ${dA('edN',n.id)}><b>${esc(n.title)}</b><small>${esc(n.body.slice(0,80))}</small>${n.img?`<img class="th" src="${esc(n.img)}" alt="Gambar catatan">`:''}</div>${n.link?`<a href="${esc(n.link)}" target="_blank" rel="noopener noreferrer" class="ib" aria-label="Buka tautan">${ic('r')}</a>`:''}</div>`).join('')}</div>`).join('')||empty(q?'Tidak ditemukan.':'Belum ada catatan.');
}
document.addEventListener('input',e=>{if(e.target.id=='q'){q=e.target.value;$('#nl').innerHTML=noteList()}if(e.target.id=='cx'){cx=e.target.value;prev()}});
document.addEventListener('keydown',e=>{if(e.target.id=='cx'&&e.key=='Enter')A.k('=')});
const fN=[['title','Judul','text'],['subject','Mata pelajaran','text',0,0],['body','Isi catatan','area',0,0],['link','Tautan penting (https://...)','url',0,0],['img','Gambar (opsional)','img',0,0]];
const nOK=o=>o.link&&!/^https?:\/\//i.test(o.link)?'Tautan harus diawali http:// atau https://':null;
A.addN=()=>form('Catatan baru',fN,{},o=>nOK(o)||void db.notes.push({id:uid(),ts:Date.now(),...o}));
A.edN=id=>{const n=db.notes.find(x=>x.id==id);form('Edit catatan',fN,n,o=>nOK(o)||void Object.assign(n,o,{ts:Date.now()}),()=>db.notes=db.notes.filter(x=>x.id!=id))};

V.cal=()=>{
  const y=cm.getFullYear(),m=cm.getMonth(),f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();
  let c=DAYS.map(d=>`<span>${d.slice(0,3)}</span>`).join('')+'<div></div>'.repeat(f);
  for(let d=1;d<=n;d++){const s=y+'-'+pad(m+1)+'-'+pad(d),e=db.events.filter(x=>x.date==s);
    c+=`<button class="${s==ymd()?'td':''} ${e.some(x=>x.type=='Libur')?'hl':''}" ${dA('addE',s)} aria-label="${d} ${MON[m]}">${d}${e.length?'<i></i>':''}</button>`}
  const up=db.events.filter(e=>e.date>=ymd()).sort(by('date'));
  return hd('Kalender',addBtn('addE'))+`<div class="card"><div class="top"><button class="ib" ${dA('mo','-1')} aria-label="Bulan sebelumnya">${ic('l')}</button><b>${MON[m]} ${y}</b><button class="ib" ${dA('mo','1')} aria-label="Bulan berikutnya">${ic('r')}</button></div><div class="cal">${c}</div></div>
  <h2>Kegiatan mendatang</h2><div class="card">${up.map(e=>`<div class="row"><div class="g" ${dA('edE',e.id)}><b>${esc(e.title)}</b><small>${esc(e.type)} · ${fd(e.date)}</small></div></div>`).join('')||empty('Ketuk tanggal untuk menambah kegiatan.')}</div>`};
A.mo=v=>{cm=new Date(cm.getFullYear(),cm.getMonth()+ +v,1);render()};
const fE=[['title','Judul','text'],['type','Jenis','sel',['Kegiatan','Ujian','Libur','Agenda'].map(x=>[x,x])],['date','Tanggal','date'],['rem','Pengingat','sel',OFF]];
const eSave=(e,o)=>{const{rem,...r}=o;Object.assign(e,r);link('e'+e.id,e.type+': '+e.title,fd(e.date),e.type=='Ujian'?'Ujian':'Kegiatan',e.date,'08:00',e.type=='Libur'?'':rem)};
A.addE=d=>form('Tambah kegiatan',fE,{date:d&&d.length==10?d:ymd(),rem:'1440'},o=>{const e={id:uid()};eSave(e,o);db.events.push(e)});
A.edE=id=>{const e=db.events.find(x=>x.id==id),r=db.reminders.find(x=>x.ref=='e'+id);
  form('Edit kegiatan',fE,{...e,rem:r?String(Math.round((new Date(e.date+'T08:00')-new Date(r.at))/60000)):''},o=>eSave(e,o),()=>{db.events=db.events.filter(x=>x.id!=id);link('e'+id)})};

V.notif=()=>`<div class="top"><button class="ib" ${dA('tab','home')} aria-label="Kembali">${ic('l')}</button><h1 style="flex:1">Notifikasi</h1>${addBtn('addR')}</div>
  <div class="card"><small>${permInfo()}</small>${'Notification' in window&&Notification.permission=='default'?`<button class="btn" ${dA('perm')}>Izinkan notifikasi</button>`:''}</div>
  <h2>Pengingat aktif</h2><div class="card">${db.reminders.filter(r=>!r.done).sort(by('at')).map(r=>`<div class="row"><div class="g" ${dA('edR',r.id)}><b>${esc(r.title)}</b><small>${esc(r.type)} · ${ft(r.at)}${r.repeat?' · berulang':''}</small></div></div>`).join('')||empty('Tidak ada pengingat aktif.')}</div>
  <div class="top"><h2>Riwayat</h2>${db.notifs.length?`<button class="btn lt" style="width:auto;margin:0;padding:8px 14px;min-height:0" ${dA('readAll')}>Tandai semua dibaca</button>`:''}</div>
  <div class="card">${db.notifs.map(n=>`<div class="row"><div class="g" ${dA('rd',n.id)} style="${n.read?'opacity:.6':''}"><b>${n.read?'':'<span style="color:var(--b)">● </span>'}${esc(n.title)}</b><small>${esc(n.body)} · ${ft(n.time)}</small></div><button class="ib" ${dA('dn',n.id)} aria-label="Hapus">${ic('x',18)}</button></div>`).join('')||empty('Belum ada notifikasi.')}</div>`;

  m.querySelector('[data-mk]').onclick=()=>{const r=impManual(m.querySelector('#imname').value,m.querySelector('#imtx').value,lk());if(typeof r=='string'){er.textContent=r;return}m.remove();A.plo(r.pl.id);toast('Playlist dibuat',r.n+' lagu. Dicocokkan ke YouTube Music…')};
  go.onclick=async()=>{er.textContent='';ifb.hidden=true;const a=m.querySelector('#ia').value.trim(),x=m.querySelector('#ix').value.trim();
    if(x&&!x.includes('{url}'))return er.textContent='Alamat proxy harus memuat {url}.';
    db.mcfg={api:a,px:x};PLp=null;pgood='';pOff=0;gp=-1;save();
    go.disabled=true;i.disabled=true;pg.hidden=false;pg.textContent='Mengambil daftar lagu…';
    try{const r=await impLink(i.value.trim());m.remove();if(r.pl){A.plo(r.pl.id);toast('Playlist diimpor',r.n+' lagu dari “'+r.pl.name+'”')}else{render();toast('Lagu ditambahkan',r.name)}}
    catch(e){er.textContent=e&&e.message?e.message:'Gagal mengimpor. Coba lagi.';m.querySelector('[data-emb]').style.display=isYtLink(i.value)?'none':'';ifb.hidden=false;pg.hidden=true;i.disabled=false;chk()}}};
A.plo=id=>{plv=id;tab='plist';scrollTo(0,0);render();resolveAll(id)};
A.plp=id=>{sh=false;const i=M().findIndex(t=>t.pl==id);if(i>=0)play(i)};
A.pls=id=>{const l=M().map((t,i)=>i).filter(i=>M()[i].pl==id);if(!l.length)return;sh=true;play(l[Math.floor(Math.random()*l.length)])};
function delPl(id){const ct=trk();M().filter(t=>t.pl==id&&t.lf).forEach(t=>bDel(t.id));db.music=M().filter(t=>t.pl!=id);db.pls=(db.pls||[]).filter(p=>p.id!=id);cur=ct?db.music.indexOf(ct):-1;if(cur<0){au.pause();au.removeAttribute('src');tok++;ld=0;A.cfp()}save();mini();tab='music';render()}
A.menuP=id=>{const p=(db.pls||[]).find(x=>x.id==id);if(!p)return;
  const m=sheet(`<div class="hd"><b>${esc(p.name)}</b><button class="ib" data-x aria-label="Tutup">${ic('x')}</button></div><button class="btn lt" data-rs>Cocokkan ulang lagu &amp; durasi</button><button class="btn red" data-rm>Hapus playlist</button>`);m.firstChild.classList.add('dk');
  m.querySelector('[data-rs]').onclick=()=>{m.remove();M().filter(t=>t.pl==id).forEach(t=>{delete t.nf;if(!t.ys)delete t.yt;delete t.bad;delete t.rt});pOff=0;resolveAll(id);render()};
  m.querySelector('[data-rm]').onclick=()=>ask('Hapus playlist beserta semua lagunya?',()=>{m.remove();delPl(id)})};

const TABS=[['home','Beranda','home'],['sched','Jadwal','clock'],['notes','Catatan','note'],['cal','Kalender','cal'],['set','Pengaturan','set']];
A.tab=t=>{tab=t;scrollTo(0,0);render()};
/* ---------- Cari musik: /api/search (Deezer + iTunes: pencocokan, peringkat, pemisahan versi) + cadangan Audius ---------- */
/* Metadata & peringkat dari /api/search (fungsi serverless Vercel). Audio TIDAK berasal dari sana:
   lagu yang diketuk masuk ke "Lagu saya" lalu diputar sebagai audio lewat pemutar MySchool yang sudah ada (durasi asli dipakai untuk mencocokkan versi yang benar).
   Jika /api/search tidak tersedia, pencarian otomatis memakai katalog Audius (diurutkan & dikelompokkan di sisi klien). */
const AUH=['https://api.audius.co','https://discoveryprovider.audius.co'],AUA='MySchool';
let srQ='',srRes=[],srBusy=0,srErr='',srTk=0,srKind='original',srId=db.srId!==0,srSrc='',srArt=null,srApx=0,srSug=[];
const SRK=[['original','Original'],['dj','DJ'],['remix','Remix'],['cover','Cover']];
const cRe={dj:/\b(dj|nightcore|breakbeat|funkot|jedag jedug|dugem|full bass|bass boosted)\b/i,remix:/\b(remix|rmx|bootleg|mashup|edit|mix|slowed|sped up|speed up|reverb)\b/i,cover:/\b(cover|tribute|karaoke|versi cover)\b/i};
const srNorm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
function srCls(x){const t=x.title+' '+x.artist;return cRe.dj.test(t)?'dj':cRe.remix.test(x.title)?'remix':cRe.cover.test(t)?'cover':'original'}
/* cadangan: Audius, dengan pencocokan judul/artis sederhana + pemisahan versi (tanpa data popularitas) */
async function srAudius(q){let last;for(const h of AUH){const c=new AbortController(),to=setTimeout(()=>c.abort(),9000);try{
  const r=await fetch(h+'/v1/tracks/search?query='+encodeURIComponent(q)+'&limit=40&app_name='+AUA,{signal:c.signal});clearTimeout(to);
  if(!r.ok)throw new Error('http '+r.status);const j=await r.json(),qt=srNorm(q).split(' ').filter(Boolean);
  return(j.data||[]).filter(x=>x&&x.id&&x.title&&x.is_streamable!==false&&!x.is_delete).map(x=>{
    const o={src:'aud',aid:String(x.id),title:String(x.title),artist:(x.user&&x.user.name)||'',dur:Math.round(x.duration)||0,cover:(x.artwork&&(x.artwork['480x480']||x.artwork['150x150']||x.artwork['1000x1000']))||'',url:h+'/v1/tracks/'+encodeURIComponent(x.id)+'/stream?app_name='+AUA};
    const tx=srNorm(o.title+' '+o.artist);o.kind=srCls(o);o.sc=qt.length?qt.filter(w=>tx.includes(w)).length/qt.length:0;
    if(srNorm(o.artist)==srNorm(q))o.sc+=.5;if(srNorm(o.title)==srNorm(q))o.sc+=.4;return o}).filter(o=>o.sc>=.5).sort((a,b)=>b.sc-a.sc)
  }catch(e){clearTimeout(to);last=e}}throw last||new Error('net')}
async function srFetch(q){
  try{const c=new AbortController(),to=setTimeout(()=>c.abort(),12000);
    const r=await fetch('/api/search?q='+encodeURIComponent(q)+'&id='+(srId?1:0),{signal:c.signal});clearTimeout(to);
    if(!r.ok)throw new Error('http '+r.status);const j=await r.json();
    if(!j||!Array.isArray(j.items))throw new Error('bad');
    return{src:'api',artist:j.artist||null,approx:!!j.approx,suggest:Array.isArray(j.suggest)?j.suggest:[],items:j.items.map(x=>({...x,src:'api'}))}
  }catch(e){return{src:'aud',artist:null,approx:0,suggest:[],items:await srAudius(q)}}}
const srOn=x=>{const c=trk();return!!c&&(x.src=='aud'?c.aid==x.aid:!!x.dz&&c.dz==x.dz)};
const srCnt=k=>srRes.filter(x=>x.kind==k).length;
function srList(){if(srBusy)return'<p class="empty">Mencari…</p>';if(srErr)return`<p class="err">${esc(srErr)}</p>`;if(!srQ)return'';
  const sg=srSug.length?`<div style="margin:6px 0">${srSug.map((n,i)=>`<button class="chip" ${dA('srq',''+i)}>${esc(n)}</button>`).join(' ')}</div>`:'';
  if(!srRes.length)return'<p class="empty">Tidak ada hasil yang cocok. Coba judul atau nama artis lain.</p>'+(sg?'<small>Mungkin maksud Anda:</small>'+sg:'');
  const pa=!au.paused||ld;
  /* jika tidak ada lagu original sama sekali, langsung tampilkan kelompok yang ada isinya */
  let k=srKind;if(!srCnt(k)){const f=SRK.find(z=>srCnt(z[0]));if(f)k=f[0]}
  const l=srRes.map((x,i)=>({x,i})).filter(o=>o.x.kind==k);
  const pills=`<div class="bar" style="margin:8px 0 4px;flex-wrap:wrap">${SRK.map(z=>`<button class="pill ${k==z[0]?'on':''}" ${dA('srk',z[0])}>${z[1]} ${srCnt(z[0])}</button>`).join('')}</div>`;
  const tg=srSrc=='api'?`<div style="margin:2px 0 6px"><button class="chip" ${dA('sri')} aria-pressed="${srId}">${srId?'✓ ':''}Utamakan lagu Indonesia</button></div>`:'';
  const apx=srApx&&srSrc=='api'?`<small style="display:block;margin-top:6px">“${esc(srQ)}” tidak ditemukan persis. Menampilkan alternatif terdekat.</small>${sg}`:'';
  const head=apx+(srArt&&srSrc=='api'&&!srApx?`<small style="display:block;margin-top:6px">Artis: <b>${esc(srArt.name)}</b>${k=='original'?' — lagu asli ditampilkan lebih dulu':''}</small>`:'');
  return tg+head+pills+l.map(({x,i})=>{const on=srOn(x);const bd=[x.id&&srSrc=='api'?'Indonesia':'',x.live?'Live':'',x.pop!=null&&x.pop>=.8?'Populer':''].filter(Boolean).join(' • ');
    return`<div class="sr" ${dA('srp',''+i)}>${cover(x,'sr2')}<div class="g"><b>${esc(x.title)}${on?' ♪':''}</b><small>${esc(x.artist)}${x.dur?' • '+mt(x.dur):''}${bd?' • '+bd:''}</small></div><span class="sp2">${icf(on&&pa?'pause':'play',18)}</span></div>`}).join('')
   +(l.length?'':'<p class="empty">Tidak ada di kelompok ini.</p>')
   +`<small style="display:block;margin-top:6px">${srSrc=='api'?'Data lagu dari Deezer &amp; iTunes. Label “Populer” berdasar peringkat Deezer. Audio diputar tanpa video.':'Musik dari Audius. Hak cipta milik para artis.'}</small>`}
const srUp=()=>{const c=$('#srr');if(c)c.innerHTML=srList()};
A.srk=k=>{srKind=k;srUp()};
A.srq=i=>{const n=srSug[+i],f=document.querySelector('.srf'),inp=f&&f.querySelector('input');if(!n||!inp)return;inp.value=n;f.requestSubmit?f.requestSubmit():srUp()};
A.sri=()=>{srId=!srId;db.srId=srId?1:0;save();if(srQ){const f=document.querySelector('.srf');if(f)f.requestSubmit?f.requestSubmit():srUp()}else srUp()};
A.srp=i=>{const x=srRes[+i];if(!x)return;
  let k=x.src=='aud'?M().findIndex(t=>t.aid==x.aid):M().findIndex(t=>t.dz&&t.dz==x.dz);
  if(k>=0&&k==cur){if(au.paused)au.play().catch(()=>{});else au.pause();setTimeout(srUp,120);return}
  if(k<0){
    if(x.src=='aud')M().push({id:uid(),type:'audio',title:x.title,artist:x.artist,url:x.url,cover:x.cover,sp:'',fav:false,dur:x.dur,aid:x.aid});
    /* lagu dari /api/search: audio dicocokkan lewat pemutar resmi YouTube (IFrame) berdasarkan judul+artis+durasi asli, tetap tampil sebagai audio saja */
    else M().push({id:uid(),type:'imp',title:x.title,artist:x.artist,url:'',cover:x.cover||'',sp:'',fav:false,dur:x.dur||0,pv:'',yt:'',dz:x.dz||'',dzk:x.kind});
    save();k=M().length-1}
  play(k);srUp()};
['play','pause','ended'].forEach(n=>{const o=au['on'+n];au['on'+n]=e=>{if(o)o(e);srUp()}});
document.addEventListener('submit',e=>{if(!e.target.matches('.srf'))return;e.preventDefault();const q=e.target.querySelector('input').value.trim();if(!q)return;
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  srQ=q;srErr='';srKind='original';if(!navigator.onLine){srRes=[];srErr='Tidak ada koneksi internet.';srUp();return}
  const k=++srTk;srBusy=1;srUp();
  srFetch(q).then(r=>{if(k==srTk){srRes=r.items;srSrc=r.src;srArt=r.artist;srApx=r.approx?1:0;srSug=r.suggest||[]}}).catch(()=>{if(k==srTk){srRes=[];srErr='Pencarian gagal. Periksa koneksi lalu coba lagi.'}}).finally(()=>{if(k==srTk){srBusy=0;srUp()}})});

function render(){
  document.body.classList.toggle('mus',tab=='music'||tab=='plist');$('#main').innerHTML=V[tab]();if(tab=='calc')prev();
  const cur=['tasks','calc','calch','music','plist'].includes(tab)?'set':tab;
  $('#nav').innerHTML=TABS.map(t=>`<button class="${cur==t[0]?'on':''}" ${dA('tab',t[0])} ${cur==t[0]?'aria-current="page"':''}>${ic(t[2])}${t[1]}</button>`).join('');
}
render();tick();setInterval(tick,15000);
/* siapkan pemutar & cocokkan semua lagu impor di latar belakang, supaya ketuk lagu langsung terputar */
setTimeout(()=>{(db.pls||[]).forEach(p=>resolveAll(p.id))},1500);
</script></body></html>
